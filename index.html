<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuki Store - Dashboard v1.0</title>
    <meta property="og:title" content="Yuki Store - Dashboard v1.0">
    <meta property="og:description" content="Solusi digital terbaik untuk kebutuhan panel Pterodactyl, sewa bot WhatsApp, dan script premium terupdate.">
    <meta property="og:url" content="https://yukii-store.vercel.app">
    <meta property="og:image" content="https://yuki-regal.vercel.app//Yuki1785994239187.jpg">
    <meta property="og:type" content="website">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <link rel="icon" href="https://yuki-regal.vercel.app//Yuki1785746271503.jpg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { inter: ['Inter', 'sans-serif'] } } }
        }
    </script>
</head>
<body>

    <div id="proseka-loader" class="fixed inset-0 bg-[#f4f7f6] z-[9999] flex flex-col justify-between items-center py-12 overflow-hidden transition-opacity duration-500">
        <div class="proseka-bg-pattern"></div>
        <div class="flex-1 flex flex-col justify-center items-center relative z-10 animate-fade-in-up">
            <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-pink-500 via-cyan-400 to-blue-500 flex items-center justify-center shadow-xl shadow-cyan-200/50 mb-4 tracking-wider animate-bounce-slow">
                <i data-lucide="sparkles" class="w-10 h-10 text-white"></i>
            </div>
            <h2 class="font-extrabold text-2xl text-slate-700 tracking-widest">YUKI STORE</h2>
            <div class="h-[3px] w-12 bg-cyan-400 mt-2 rounded-full"></div>
        </div>
        <div class="w-full max-w-xs px-6 relative z-10">
            <div class="flex justify-between items-end mb-2">
                <div class="text-xs font-bold text-slate-400 tracking-wider flex items-center gap-1">
                    <span>NOW LOADING</span>
                    <span class="dot-bounce">.</span><span class="dot-bounce [animation-delay:0.2s]">.</span><span class="dot-bounce [animation-delay:0.4s]">.</span>
                </div>
                <div id="loader-percentage" class="text-sm font-black text-pink-500 italic tracking-tighter">0%</div>
            </div>
            <div class="w-full h-[6px] bg-slate-200 rounded-full overflow-hidden p-[1px]">
                <div id="loader-progress-bar" class="w-0 h-full bg-gradient-to-r from-pink-500 to-rose-400 rounded-full shadow-[0_0_8px_rgba(244,63,94,0.6)] transition-all duration-100 ease-out"></div>
            </div>
        </div>
    </div>

    <!-- SPA Container -->
    <div id="app-root"></div>

    <script src="script/loader.js"></script>
    <script src="script/index.js"></script>
    <script src="script/pterodactyl.js"></script>
    <script src="script/sewa-bot.js"></script>
    <script src="script/script-yuki.js"></script>
    <script src="script/spotify.js"></script>
    <script src="script/music-player.js"></script>
    <script src="script/pinterest.js"></script>
    <script src="script/anime-player.js"></script>
    
    <!-- SCRIPT UTAMA - HARUS DIPANGGIL TERAKHIR -->
    <script src="script.js"></script>
    
</body>
</html>
